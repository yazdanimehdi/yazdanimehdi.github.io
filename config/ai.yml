# AI assist (admin): which provider writes and which draws. API keys never go here: set them on the admin's AI
# screen (Postgres mode) or as environment variables. Empty models use each provider's current default.
text:
  provider: anthropic # anthropic | openai | google
  model: ''
image:
  provider: openai # openai | google | higgsfield
  model: ''
# video: # Generate GIF: always Higgsfield image-to-video, whichever image provider is chosen
#   model: '' # empty uses bytedance/seedance-2.5/image-to-video
papers:
  autoPost: true # write a draft post for each new paper found on Google Scholar
  schedule: { every: day } # off | day | week (+ weekday 0-6, Sunday first) | month (+ monthday 1-28); UTC
  maxPostsPerRun: 3 # bounds one daily run's time and spend; more new papers wait for the next run
