# Site Configuration
# Edit this file to customize your academic website

# "personal" = individual academic site, "lab" = research group site
siteMode: 'personal'

# Language and direction
lang: 'en' # BCP 47 language tag (e.g. "en", "fa", "ar", "zh")
direction: 'ltr' # "ltr" (left-to-right) or "rtl" (right-to-left)

# Interface text for both themes, by string id (see src/lib/ui-strings.ts for every id and its English default).
# Set only what you want to change, e.g. to translate a site whose `lang` has no built-in table.
# ui:
#   home.viewPublications: 'View publications'
#   home.allPublications: 'All {count} publications'
#   contact.heading: 'Get in touch'
#   about.personal: 'Biography' # classic: the About heading on a personal site

# Default theme when no user preference is saved
defaultTheme: 'system' # "light" | "dark" | "system"

# Visual theme: "journal" (default) or "classic" (legacy). "editorial" is an older name for journal.
# Build-time override: SCHOLAROS_THEME=classic pnpm build
theme: 'journal'

# Built-in picture for news items that have no image of their own, one per category (paper, grant, award, talk,
# media, general). Unset follows the theme: journal → "ink" line plates, classic → "geometric".
# newsArt: 'ink' # "ink" | "engraving" | "watercolor" | "geometric"

# Journal theme content. Name, email and links come from author/socials below. Without `figure` the
# home hero is a single column. The classic hero also reads eyebrow (personal role) and tagline,
# and its closing block reads contact.
editorial:
  # night: 'lamplight' # dark-mode palette: "lamplight" (default) | "inkwell" | "galley"
  # labRole: 'Department of Computer Science · University of Technology' # lab mode's line under the name; default: department · university
  eyebrow: 'AI Research Scientist · Computational Biology'
  tagline: 'Representation learning for biological systems, from mRNA language models to drug–target interaction.'
  bio: 'I’m a Senior Research Scientist at **DeepBio Scientific**, where I lead research on machine learning for biomedical data and agentic systems for retrieval and reasoning. Previously I was at **Microsoft** and **Johnson & Johnson**, and earned my PhD in Computer Science at UCF.'
  figure:
    image: '/images/hero-figure.webp'
    alt: 'Line drawing of a protein binding-site graph with highlighted attention nodes'
    caption: 'Attention concentrates on a few residues of a protein binding-site graph, the idea behind AttentionSiteDTI.'
  affiliations:
    - 'DeepBio Scientific'
    - 'Microsoft'
    - 'Johnson & Johnson'
    - 'University of Central Florida'
  contact:
    heading: 'Interested in collaborating?'
    text: 'I’m open to research collaborations, talks and conversations about machine learning for biology and drug discovery.'
    # links: # optional onward links in the home contact band, e.g. for prospective students
    #   - label: 'Prospective students'
    #     href: '/join'

# Top bar (thin bar above header, classic theme). `links` show on lab sites only; a personal
# site's bar carries just `text`.
topBar:
  enabled: false
  text: ''
  links: []

# Hero background configuration
hero:
  type: 'pattern' # "image" | "video" | "pattern" | "animation" | "none"
  light:
    bgColor: '#ffffff'
    bgImage: '' # e.g. "/images/hero-light.jpg"
  dark:
    bgColor: '#0d1117'
    bgImage: '' # e.g. "/images/hero-dark.jpg"
  video:
    src: '/videos/hero-bg.mp4'
    poster: '/images/hero-poster.jpg'
  pattern:
    name: 'grid' # grid | dots | diagonal | waves | hexagons | crosses | triangles | zigzag | rings | scales | topography | helix | circuit | molecules | cubes | stipple | sparkles
    # color: 'accent' # empty: the brand gradient, or text color; 'accent' / 'secondary'; or any CSS color
    # color2: '#14b8a6' # a second color: the lines run in a gradient
    # angle: 135 # gradient direction in degrees
    # strength: 'subtle' # subtle | medium | strong
    # fade: true # false: full strength across the hero
    # interactive: true # the pattern lights up around the cursor
  animation:
    preset: 'wave-lines' # "particles" | "gradient-morph" | "geometric" | "wave-lines" | "custom"
    customScript: '' # path to JS file in /public (when preset: "custom")
  # portrait: # optional photo beside the classic hero text
  #   image: '/images/portrait.jpg'
  #   alt: 'Jane Smith'

# Typography
fonts:
  # families:                 # optional; theme defaults when unset
  #   sans: 'Roboto'          # classic default; editorial default 'IBM Plex Sans'
  #   serif: 'Roboto Slab'    # classic default; editorial default 'Source Serif 4'
  #   mono: 'Roboto Mono'     # classic default; editorial default 'IBM Plex Mono'
  sizes:
    base: '1.2rem' # Body text (default: 1rem / 16px)
    sm: '0.95rem' # Meta text, dates, tags (default: 0.875rem / 14px)
    lg: '1.3rem' # Lead paragraphs (default: 1.125rem / 18px)
    h1: '2.3rem' # Page titles in prose (default: 2rem / 32px)
    h2: '1.7rem' # Section headings in prose (default: 1.5rem / 24px)
    h3: '1.5rem' # Subsection headings in prose (default: 1.25rem / 20px)

# Colors
# Brand: two hexes that color the whole site (accents in both modes, hover and selection shades, the hero
# pattern's gradient). Set, they replace `colors` below.
# brand:
#   primary: '#7c3aed'
#   secondary: '#14b8a6'

colors:
  light:
    primary: '#1f3c88'
    secondary: '#06b6d4'
  dark:
    # primary: unset, so the journal uses its night blue and classic its cyan. A journal accent set here
    # is lifted until it reads at 4.5:1 on the chosen night palette (editorial.night).
    secondary: '#2c5282'

# Page background
background:
  light:
    color: '#ffffff'
    image: ''
  dark:
    color: '#0d1117'
    image: ''

# Image shape for people photos and about section
imageShape: 'rectangular' # "rectangular" | "circular" | "oval"

# About section (shown on homepage between hero and content grid)
about:
  enabled: true
  title: 'About Mehdi Yazdani-Jahromi'
  text: 'AI research scientist and PhD in Computer Science specializing in representation learning, with primary applications in computational biology and drug discovery. Industry experience at Johnson and Johnson and Microsoft, where I developed language models for mRNA and machine learning systems for large scale biomedical data. Published in NeurIPS, ICLR and Briefings in Bioinformatics, with work spanning mRNA modeling, drug target interaction prediction and algorithmic fairness.'
  image: '/images/people/profile.jpg'
  imageAlt: 'Mehdi Yazdani-Jahromi'

# Homepage section order and visibility
# Drag to reorder in the CMS; set enabled: false to hide a section
homepageSections:
  - id: hero
    enabled: true
  - id: about
    enabled: true
  - id: news
    enabled: true
  - id: publications
    enabled: true
  - id: blog
    enabled: true

