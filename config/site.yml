# Site Configuration
# Edit this file to customize your academic website

# "personal" = individual academic site, "lab" = research group site
siteMode: 'personal'

# Language and direction
lang: 'en' # BCP 47 language tag (e.g. "en", "fa", "ar", "zh")
direction: 'ltr' # "ltr" (left-to-right) or "rtl" (right-to-left)

# Interface text for both themes, by string id (see src/lib/ui-strings.ts for every id and its English default).
# Set only what you want to change, e.g. to translate a site whose `lang` has no built-in table.
# ui:
#   home.viewPublications: 'View publications'
#   home.allPublications: 'All {count} publications'
#   contact.heading: 'Get in touch'
#   about.personal: 'Biography' # classic: the About heading on a personal site

# Default theme when no user preference is saved
defaultTheme: 'light' # "light" | "dark" | "system"

# Visual theme: "journal" (default) or "classic" (legacy). "editorial" is an older name for journal.
# Build-time override: SCHOLAROS_THEME=classic pnpm build
theme: 'journal'

# Built-in picture for news items that have no image of their own, one per category (paper, grant, award, talk,
# media, general). Unset follows the theme: journal → "ink" line plates, classic → "geometric".
# newsArt: 'ink' # "ink" | "engraving" | "watercolor" | "geometric"

# Journal theme content. Name, email and links come from author/socials below. Without `figure` the
# home hero is a single column. The classic hero also reads eyebrow (personal role) and tagline,
# and its closing block reads contact.
editorial:
  # night: 'lamplight' # dark-mode palette: "lamplight" (default) | "inkwell" | "galley"
  # labRole: 'Department of Computer Science · University of Technology' # lab mode's line under the name; default: department · university
  eyebrow: 'Associate Professor · Computer Science'
  tagline: 'Language technology that works for every language, and that people can trust.'
  bio: 'I lead the Smith Research Lab at the **University of Technology**, where we study natural language processing, multimodal learning and AI safety. Before that I was an assistant professor at **Previous University**.'
  figure:
    image: '/images/hero-figure.webp'
    alt: 'Line drawing of a row of word tokens; arcs rise from a few of them and meet at one point above'
    caption: 'Attention concentrates on a few tokens of a long input, the idea behind adaptive fine-tuning.'
  affiliations:
    - 'University of Technology'
    - 'Previous University'
    - 'University of Example'
  contact:
    heading: 'Interested in collaborating?'
    text: 'I am open to research collaborations, talks and conversations about language technology and AI safety.'
    # links: # optional onward links in the home contact band, e.g. for prospective students
    #   - label: 'Prospective students'
    #     href: '/join'

# Top bar (thin bar above header, classic theme). `links` show on lab sites only; a personal
# site's bar carries just `text`.
topBar:
  enabled: true
  text: 'Department of Computer Science, University of Technology'
  links:
    - label: 'Apply Now'
      href: '/positions'
    - label: 'Campus Map'
      href: 'https://university.edu/map'
      external: true

# Hero background configuration
hero:
  type: 'pattern' # "image" | "video" | "pattern" | "animation" | "none"
  light:
    bgColor: '#ffffff'
    bgImage: '' # e.g. "/images/hero-light.jpg"
  dark:
    bgColor: '#0d1117'
    bgImage: '' # e.g. "/images/hero-dark.jpg"
  video:
    src: '/videos/hero-bg.mp4'
    poster: '/images/hero-poster.jpg'
  pattern:
    name: 'grid' # grid | dots | diagonal | waves | hexagons | crosses | triangles | zigzag | rings | scales | topography | helix | circuit | molecules | cubes | stipple | sparkles
    # color: 'accent' # empty: the brand gradient, or text color; 'accent' / 'secondary'; or any CSS color
    # color2: '#14b8a6' # a second color: the lines run in a gradient
    # angle: 135 # gradient direction in degrees
    # strength: 'subtle' # subtle | medium | strong
    # fade: true # false: full strength across the hero
    # interactive: true # the pattern lights up around the cursor
  animation:
    preset: 'wave-lines' # "particles" | "gradient-morph" | "geometric" | "wave-lines" | "custom"
    customScript: '' # path to JS file in /public (when preset: "custom")
  # portrait: # optional photo beside the classic hero text
  #   image: '/images/portrait.jpg'
  #   alt: 'Jane Smith'

# Typography
fonts:
  # families:                 # optional; theme defaults when unset
  #   sans: 'Roboto'          # classic default; editorial default 'IBM Plex Sans'
  #   serif: 'Roboto Slab'    # classic default; editorial default 'Source Serif 4'
  #   mono: 'Roboto Mono'     # classic default; editorial default 'IBM Plex Mono'
  sizes:
    base: '1.2rem' # Body text (default: 1rem / 16px)
    sm: '0.95rem' # Meta text, dates, tags (default: 0.875rem / 14px)
    lg: '1.3rem' # Lead paragraphs (default: 1.125rem / 18px)
    h1: '2.3rem' # Page titles in prose (default: 2rem / 32px)
    h2: '1.7rem' # Section headings in prose (default: 1.5rem / 24px)
    h3: '1.5rem' # Subsection headings in prose (default: 1.25rem / 20px)

# Colors
# Brand: two hexes that color the whole site (accents in both modes, hover and selection shades, the hero
# pattern's gradient). Set, they replace `colors` below.
# brand:
#   primary: '#7c3aed'
#   secondary: '#14b8a6'

colors:
  light:
    primary: '#1f3c88'
    secondary: '#06b6d4'
  dark:
    # primary: unset, so the journal uses its night blue and classic its cyan. A journal accent set here
    # is lifted until it reads at 4.5:1 on the chosen night palette (editorial.night).
    secondary: '#2c5282'

# Page background
background:
  light:
    color: '#ffffff'
    image: ''
  dark:
    color: '#0d1117'
    image: ''

# Image shape for people photos and about section
imageShape: 'rectangular' # "rectangular" | "circular" | "oval"

# About section (shown on homepage between hero and content grid)
about:
  enabled: true
  title: 'About Our Lab' # lab sites; personal sites use the `about.personal` ui string ("About")
  text: 'We are a multidisciplinary research group dedicated to advancing the frontiers of computer science and artificial intelligence. Our work spans natural language processing, computer vision, and human–computer interaction, with a focus on building systems that are robust, interpretable, and socially responsible.'
  image: '' # optional photo shown beside the text, e.g. '/images/about.jpg' (put the file in public/images/)
  # imageAlt: 'The lab at the 2025 retreat' # describe the photo; unset means decorative

# Homepage section order and visibility
# Drag to reorder in the CMS; set enabled: false to hide a section
homepageSections:
  - id: hero
    enabled: true
  - id: about
    enabled: true
  - id: news
    enabled: true
  - id: publications
    enabled: true
  - id: blog
    enabled: true

title: 'Research Lab'
description: 'Welcome to our research lab. We explore cutting-edge topics in computer science and artificial intelligence.'
author: 'Prof. Jane Smith'
labName: 'Smith Research Lab'
university: 'University of Technology'
department: 'Department of Computer Science'
siteUrl: 'https://example.com'
logo: '/images/logo.svg' # beside the name in the header; tab icons are the favicon files in public/

# Navigation items
nav:
  - label: 'Research'
    href: '/research'
  - label: 'People'
    href: '/people'
  - label: 'Publications'
    href: '/publications'
  - label: 'CV'
    href: '/cv'
  - label: 'Projects'
    href: '/projects'
  - label: 'News'
    href: '/news'
  - label: 'Blog'
    href: '/blog'
  - label: 'Positions'
    href: '/positions'
  - label: 'Repositories'
    href: '/repositories'
  - label: 'Contact'
    href: '/contact'

# GitHub repositories page
github:
  username: 'example-lab'
  stats: true
  trophies: false
  showPinnedRepos: true
  pinnedRepos:
    - 'nlp-toolkit'
    - 'multilingual-benchmark'
  # Self-hosted base URLs (optional, defaults to public Vercel instances)
  # statsBaseUrl: "https://your-stats-instance.vercel.app"
  # trophyBaseUrl: "https://your-trophy-instance.vercel.app"

# Social links
socials:
  email: 'lab@example.com'
  github: 'https://github.com/example-lab'
  scholar: 'https://scholar.google.com/citations?user=EXAMPLE'
  twitter: 'https://twitter.com/example_lab'
  linkedin: 'https://linkedin.com/company/example-lab'
  orcid: 'https://orcid.org/0000-0000-0000-0000'
  # mastodon: "https://mastodon.social/@example"
  # bluesky: "https://bsky.app/profile/example.bsky.social"

# Analytics (all disabled by default, opt-in)
analytics:
  googleAnalytics: '' # G-XXXXXXXXXX
  googleTagManager: '' # GTM-XXXXXXX
  cronitor: '' # site ID
  openpanel: '' # client UUID
  pirsch: '' # site ID
  microsoftClarity: '' # project ID

# Web3Forms (contact & application forms)
# Get your free access key at https://web3forms.com
web3forms:
  accessKey: '' # Your Web3Forms access key (leave empty to disable forms)

# Newsletter signup
newsletter:
  enabled: false
  accessKey: ''
  heading: 'Stay Updated'
  text: 'Subscribe to get notified about new publications and news.'

# SEO
seo:
  ogImage: '/images/og-default.jpg' # default social card for pages without their own image; '' for none
  keywords: 'language, learning, natural, multimodal, multilingual, models, vision, robustness, nlp, computer, safety, 2024, processing, computer vision, multimodal learning, ai safety, research, training, benchmark, fairness, reinforcement, natural language, language processing, language models, multilingual nlp, text generation, vision multimodal, vision-language models, image understanding, multimodal reasoning' # comma-separated keywords
  googleSiteVerification: '' # Google Search Console verification code
  bingSiteVerification: '' # Bing Webmaster verification code

# CMS admin panel path (change this to a custom secret path for security)
adminPath: 'admin'

adminUsers:
  - 'janesmith'

# Who can publish from the Site editor: GitHub usernames like adminUsers, or 'password:<username>' for a password
# account (Postgres mode). Other admins can still ask for changes, which wait for a publisher. Empty: every admin.
publishers: []

# GDPR cookie consent banner
cookieConsent: false

# Footer
footer:
  text: 'Built with <a href="https://scholaros.com">ScholarOS</a>'
  links:
    - label: 'Privacy'
      href: '/privacy'
    - label: 'Sitemap'
      href: '/sitemap-index.xml'

# Migration: al-folio
# Set this to a GitHub URL of an al-folio site to auto-migrate all content on first push.
# Example: "https://github.com/username/al-folio-site"
# After migration completes, this field is cleared automatically.
alfolioRepo: ''

