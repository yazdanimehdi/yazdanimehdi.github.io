  text: 'Subscribe to get notified about new publications and news.'

# SEO
seo:
  ogImage: '/images/og-default.jpg' # default social card for pages without their own image; '' for none
  keywords: 'learning, models, mrna, drug, interaction, model, prediction, language, fairness, fair, dti, bias, target, modeling, drug-target, systems, conference, representations, mitigating, social, protein, information, language models, molecule, design, research, representation, methods, deep, diffusion'
  googleSiteVerification: '' # Google Search Console verification code
  bingSiteVerification: '' # Bing Webmaster verification code

# CMS admin panel path (change this to a custom secret path for security)
adminPath: 'admin'

adminUsers:
  - 'yazdanimehdi'

# Who can publish from the Site editor: GitHub usernames like adminUsers, or 'password:<username>' for a password
# account (Postgres mode). Other admins can still ask for changes, which wait for a publisher. Empty: every admin.
publishers: []

# GDPR cookie consent banner
cookieConsent: false

# Footer
footer:
  text: 'Built with <a href="https://scholaros.com">ScholarOS</a>'
  links:
    - label: 'Privacy'
      href: '/privacy'
    - label: 'Sitemap'
      href: '/sitemap-index.xml'

# Migration: al-folio
# Set this to a GitHub URL of an al-folio site to auto-migrate all content on first push.
