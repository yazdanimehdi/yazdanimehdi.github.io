<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Duplicate names</title></head>
<body>
  <h1>Research Engineer</h1>
  <form>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" />
    <label for="email2">Confirm email</label>
    <input type="email" id="email2" name="email" />
    <button type="submit">Submit Application</button>
  </form>
<script>
  document.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    await fetch("/submit", { method: "POST", body: new URLSearchParams(new FormData(e.target)) });
    e.target.outerHTML = "<p>Thank you, your application was received</p>";
  });
</script>
</body>
</html>
