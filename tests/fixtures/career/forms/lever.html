<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Lever</title></head>
<body>
  <h1>Research Engineer</h1>
  <form action="#thanks">
    <label for="name">Full name *</label>
    <input id="name" name="name" required />
    <label for="email">Email *</label>
    <input type="email" id="email" name="email" required />
    <label for="linkedin">LinkedIn</label>
    <input type="url" id="linkedin" name="urls[LinkedIn]" />
    <label for="resume">Resume *</label>
    <input type="file" id="resume" name="resume" required />
    <label><input type="checkbox" name="consent" required /> I agree to the privacy policy</label>
    <button type="submit">Submit Application</button>
  </form>
<script>
  document.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    await fetch("/submit", { method: "POST", body: new FormData(e.target) });
    e.target.outerHTML = "<p id=\"thanks\">Thank you, your application was received</p>";
  });
</script>
</body>
</html>
